<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 watch panel</title>
<style>
:root {
  color-scheme: light;
  --plane: #f4f4f1; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --gray: #a09e97;
  --o1: #86b6ef; --o2: #3987e5; --o3: #1c5cab; --o4: #0d366b; --seq: #2a78d6;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --goodbg: #e7f5e7; --warnbg: #fdf1d3; --critbg: #f9e1e1; --infobg: #e4eefb;
  --mono: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Ubuntu", "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --gray: #77756f;
    --o1: #184f95; --o2: #2a78d6; --o3: #6da7ec; --o4: #b7d3f6; --seq: #3987e5;
    --goodbg: #10290f; --warnbg: #33270a; --critbg: #371414; --infobg: #10233d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --gray: #77756f;
  --o1: #184f95; --o2: #2a78d6; --o3: #6da7ec; --o4: #b7d3f6; --seq: #3987e5;
  --goodbg: #10290f; --warnbg: #33270a; --critbg: #371414; --infobg: #10233d;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.45 var(--sans); }
button, select { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--wash); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--s1); }
select { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 6px; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 20px; }
.top h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.top h1 span { font-weight: 400; color: var(--ink2); }
.asof { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; font-size: 13px; color: var(--ink2); }
.asof b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); white-space: nowrap; }
.pill.good { background: var(--goodbg); } .pill.warn { background: var(--warnbg); } .pill.crit { background: var(--critbg); } .pill.info { background: var(--infobg); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.info { background: var(--s1); }
.syncbox { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.syncbox label { font-size: 12.5px; color: var(--ink2); }
.syncline { padding: 0 20px 7px; font-size: 12.5px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.syncline .err { color: var(--ink); background: var(--critbg); border-radius: 4px; padding: 1px 8px; }
.bar { width: 160px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--s1); width: 0; }
.bar.ind i { width: 35%; animation: slide 1.4s linear infinite; }
@keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { .bar.ind i { animation: none; width: 100%; opacity: .5; } }
nav.jump { display: flex; gap: 2px 14px; flex-wrap: wrap; margin-left: auto; font-size: 12.5px; }
nav.jump a { color: var(--ink2); text-decoration: none; border-bottom: 1px solid transparent; }
nav.jump a:hover { color: var(--ink); border-bottom-color: var(--axis); }

main { max-width: 1500px; margin: 0 auto; padding: 14px 20px 60px; }
section { margin-top: 26px; }
section > h2 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
section > p.lead { margin: 0 0 10px; color: var(--ink2); max-width: 110ch; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 12px; }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px 9px; min-width: 0; }
.card h3 { font-size: 13.5px; margin: 0; font-weight: 650; }
.card .sub { color: var(--ink2); font-size: 12px; margin: 1px 0 4px; }
.card.wide { grid-column: 1 / -1; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--ink2); margin: 2px 0 0; min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.key { width: 14px; height: 0; border-top: 2.5px solid; border-radius: 2px; display: inline-block; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart text { font: 11px var(--sans); fill: var(--muted); font-variant-numeric: tabular-nums; }
svg.chart text.lab { fill: var(--ink2); }
.empty { color: var(--ink2); background: var(--wash); border-radius: 6px; padding: 12px 14px; font-size: 13px; margin: 6px 0; }
.empty b { color: var(--ink); }
details.tv { margin-top: 3px; font-size: 12px; }
details.tv summary { cursor: pointer; color: var(--muted); width: max-content; }
details.tv summary:hover { color: var(--ink2); }
.scroll { overflow: auto; max-height: 340px; }
.scroll.free { max-height: none; }
table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
th, td { padding: 4px 9px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); vertical-align: bottom; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.wrap { white-space: normal; word-break: break-word; }
td.nw { white-space: nowrap; }
tr.dim td { color: var(--muted); }
th.grp { text-align: center; border-bottom: 1px solid var(--axis); }
td.heat { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.mini { display: inline-block; width: 54px; height: 6px; background: var(--grid); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--s1); }

.banner { border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; border: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.banner .ic { font-size: 16px; line-height: 1.3; flex: none; }
.banner.warn { background: var(--warnbg); } .banner.crit { background: var(--critbg); } .banner.good { background: var(--goodbg); } .banner.info { background: var(--infobg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; min-width: 0; }
.tile .l { font-size: 12px; color: var(--ink2); }
.tile .v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin: 1px 0; overflow-wrap: anywhere; }
.tile .v small { font-size: 13px; font-weight: 400; color: var(--ink2); letter-spacing: 0; }
.tile .d { font-size: 12.5px; color: var(--ink2); overflow-wrap: anywhere; }
.meter { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--s1) 22%, transparent); overflow: hidden; margin: 5px 0 3px; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.meter.mk { position: relative; overflow: visible; height: 8px; }
.meter.mk i { position: absolute; left: 0; top: 0; }
.meter.mk b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.meter.mk span { position: absolute; top: 9px; font-size: 10.5px; color: var(--ink2); transform: translateX(-50%); white-space: nowrap; }
.tile .d.gap { margin-top: 14px; }
.chip { display: inline-block; border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; margin: 1px 3px 1px 0; font-size: 12px; background: var(--wash); white-space: nowrap; }
.filters { position: sticky; top: var(--toph, 96px); z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; background: var(--plane); padding: 8px 0; margin-top: 22px; border-bottom: 1px solid var(--border); font-size: 13px; }
.filters label { color: var(--ink2); display: inline-flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; background: var(--surface); }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 7px; padding: 7px 10px; font-size: 12.5px;
  box-shadow: 0 6px 22px rgba(0,0,0,.18); max-width: 380px; display: none; }
#tip .hd { color: var(--ink2); font-size: 12px; margin-bottom: 3px; }
#tip .r { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
#tip .r b { font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
#tip .r span.nm { color: var(--ink2); }
pre.raw { font: 11.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; max-height: 380px; overflow: auto; background: var(--wash); border-radius: 6px; padding: 10px; }
.ribbon text { font: 11px var(--sans); fill: var(--muted); }
.ribbon text.in { fill: #fff; font-weight: 600; }
.ribbon text.ind { fill: #0b0b0b; font-weight: 600; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 12px; }
.note { font-size: 12px; color: var(--ink2); margin-top: 6px; }
footer { color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row">
    <h1>S3 watch panel <span id="runname"></span></h1>
    <div class="asof" id="asof">loading…</div>
    <div class="syncbox">
      <button class="primary" id="b-light" title="For the chain shown: status, curve, logs, evaluations, trainer / actor / server logs, run records (about 35 MiB per finished v3 segment), plus curve.txt and supervisor.log of the chains it continues. Only new or changed files are fetched. Never downloaded: weights (*.pt), training chunks (data/), the carry backup (carry/).">Sync light</button>
      <button id="b-full" title="Light + the fight records (about 800 MiB per finished v3 segment), needed for the per-boss table. Only new or changed files are fetched.">Sync full</button>
      <button id="b-prev" title="List Nextcloud and compare with the local files (takes about 30 s)">What would a sync download?</button>
      <label>Chain
        <select id="runsel" title="Which training chain to show (and sync). auto = the chain whose status.txt was written last"></select>
      </label>
      <label>Auto-sync
        <select id="auto"><option value="0">off</option><option value="5">every 5 min (light)</option><option value="10">every 10 min (light)</option><option value="30">every 30 min (light)</option></select>
      </label>
      <label>Theme
        <select id="theme"><option value="">system</option><option value="light">light</option><option value="dark">dark</option></select>
      </label>
    </div>
  </div>
  <div class="syncline"><span id="syncline" style="display:contents"></span>
    <nav class="jump"><a href="#run">Run</a><a href="#eval">A10 evaluation</a><a href="#curric" id="nav-curric">Curriculum</a><a href="#asc" id="nav-asc">By ascension</a><a href="#potions" id="nav-potions">Potions</a><a href="#selfplay">Self-play curves</a><a href="#deaths">Deaths and fights</a><a href="#trainer">Trainer health</a><a href="#throughput">Throughput</a><a href="#problems">Problems</a></nav>
  </div>
</header>
<main>
  <section id="run"></section>
  <div class="filters" id="filters"></div>
  <section id="eval"></section>
  <section id="curric"></section>
  <section id="asc"></section>
  <section id="potions"></section>
  <section id="selfplay"></section>
  <section id="deaths"></section>
  <section id="trainer"></section>
  <section id="throughput"></section>
  <section id="problems"></section>
  <footer id="foot"></footer>
</main>
<div id="tip" role="status"></div>
<script>
"use strict";
/* ---------- state ---------- */
const S = { data: null, sync: null, parse: null, runinfo: null, builtAt: null, x: "runs", segs: "counted", smooth: 5, lower: "grouped", heatGroup: "t", bossSeg: "latest", bossKind: "boss", ascMetric: "won", vAct: "1", open: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem("s3panel") || "{}")); } catch (e) {}
{ const q = new URLSearchParams(location.search);          // e.g. ?x=time&segs=all (links and tests); the buttons below do the same
  if (["runs", "time"].includes(q.get("x"))) S.x = q.get("x"); if (["counted", "all"].includes(q.get("segs"))) S.segs = q.get("segs"); }
function savePrefs() { try { localStorage.setItem("s3panel", JSON.stringify({ x: S.x, segs: S.segs, smooth: S.smooth, lower: S.lower, heatGroup: S.heatGroup, bossKind: S.bossKind, ascMetric: S.ascMetric, vAct: S.vAct })); } catch (e) {} }
function navShow(id, on) { const a = $("nav-" + id); if (a) a.style.display = on ? "" : "none"; }
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

/* ---------- DOM helpers (text only: log content is never inserted as HTML) ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function sv(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
/* ---------- formatting ---------- */
const fi = v => v == null || isNaN(v) ? "–" : Math.round(v).toLocaleString("en-US");
const fx = (v, d = 1) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d);
const fp = (v, d = 1) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d) + "%";
const fk = v => v == null ? "–" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(Math.abs(v) >= 1e7 ? 0 : 1) + "M" : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + "k" : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(1) + "k" : String(Math.round(v));
const fmib = b => b == null ? "–" : b >= 1048576 * 1024 ? (b / 1073741824).toFixed(2) + " GiB" : (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + " MiB";
const p2 = n => String(n).padStart(2, "0");
function tUTC(ts, sec) { if (!ts) return "–"; const d = new Date(ts * 1000); return p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()) + (sec ? ":" + p2(d.getUTCSeconds()) : "") + " UTC"; }
function tLoc(ts, sec) { if (!ts) return "–"; const d = new Date(ts * 1000); return p2(d.getHours()) + ":" + p2(d.getMinutes()) + (sec ? ":" + p2(d.getSeconds()) : "") + " local"; }
function dUTC(ts) { if (!ts) return "–"; const d = new Date(ts * 1000); return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); }
function both(ts, sec) { return ts ? dUTC(ts) + " " + tUTC(ts, sec) + " · " + tLoc(ts, sec) : "–"; }
function dur(s) { if (s == null || isNaN(s)) return "–"; s = Math.max(0, Math.round(s)); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return hh ? hh + " h " + p2(m) + " min" : m ? m + " min" : s + " s"; }
function ago(s) { if (s == null || isNaN(s)) return "–"; s = Math.round(s); if (s < 0) s = 0; return s < 90 ? s + " s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : (s / 3600).toFixed(1) + " h ago"; }
const now = () => Date.now() / 1000;

/* ---------- tooltip ---------- */
const tip = $("tip");
function showTip(ev, head, rows) {
  tip.replaceChildren();
  if (head) tip.append(h("div", { class: "hd" }, head));
  for (const r of rows) tip.append(h("div", { class: "r" }, r.color ? h("span", { class: "key", style: "border-color:" + r.color }) : null, h("b", null, r.value), h("span", { class: "nm" }, r.name)));
  tip.style.display = "block";
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + hh > innerHeight - 8) y = ev.clientY - hh - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ---------- chart helpers ---------- */
const Q = [];                       // charts are drawn after their section's cards exist, so that widths are final
function flush() { for (const f of Q.splice(0)) f(); }
function sec(f) { try { f(); flush(); } catch (e) { Q.length = 0; console.error(e); document.querySelector("main").prepend(h("div", { class: "banner crit" }, "Page error in " + f.name + ": " + e.message)); } }
function niceTicks(lo, hi, n) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-6; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return { ticks: out, step };
}
function tickFmt(step) { let d = 0; while (d < 5 && Math.abs(step * Math.pow(10, d) - Math.round(step * Math.pow(10, d))) > 1e-6) d++; return v => Math.abs(v) >= 10000 ? fk(v) : v.toFixed(d); }
function segList() { const d = S.data; return (d.segments || []).filter(s => S.segs === "all" || s.counted); }
const countedFrom = () => (S.data && S.data.counted_from) || 0;      // s3a: 4 (segments 0-3 were restarts); other chains: 0
function segShown(k) { return S.segs === "all" || k >= countedFrom(); }
function xOf(p) { return S.x === "runs" ? p.runs : (p.ts != null && S.data.run_start ? (p.ts - S.data.run_start) / 3600 : null); }
function xDomain() {
  const d = S.data, segs = segList().filter(s => s.start != null);
  const st = d.status || {};
  if (S.x === "runs") {
    let lo = segs.length ? segs[0].runs_at_start || 0 : 0, hi = Math.max(st.runs_so_far || 0, ...d.macro.map(r => r.runs || 0), ...d.eval.map(e => e.runs || 0), lo + 1000);
    return [lo, hi];
  }
  const t0 = d.run_start || 0;
  let lo = segs.length ? (segs[0].start - t0) / 3600 : 0;
  let last = Math.max(st.updated || 0, ...d.segments.map(s => s.end || s.start || 0));
  return [lo, Math.max(lo + 0.5, (last - t0) / 3600)];

    lineChart(g, { id: "th-states", title: "Combat states evaluated per second", sub: "All combat server processes together", yLabel: "states / s", yMin: 0, fmt: v => fi(v), series: [ts("states_s", "states per second", "var(--s1)")] });
  }
  const segs = segList(), mx = Math.max(1, ...segs.map(s => s.runs_per_hour || 0));

    { h: "sims / s", f: s => s.actors ? fi(s.actors.sims_s) : "–", n: 1 }, { h: "bridge wait", f: s => s.actors ? fp(s.actors.wait, 0) : "–", n: 1 }, { h: "servers busy (combat / macro)", f: s => s.actors && s.actors.srv_busy != null ? fp(s.actors.srv_busy, 0) + " / " + fp(s.actors.msrv_busy, 0) : "–", n: 1 },
    { h: "error runs", f: s => s.runs ? fi(s.runs.error_n) : "–", n: 1 }, { h: "result", f: s => h("span", null, resultCell(s), s.end_est ? " · ended at the latest at the " + s.end_est + " (" + tUTC(s.end) + ")" : "", s.memguard ? " · memory guard killed " + s.memguard + " actor(s)" : ""), wrap: 1 },
    ...(segs.some(s => s.host) ? [{ h: "host", f: s => s.host || "–", t: "From status.txt (the host it names, seen at syncs) and the hosts known for the chain; – = not derivable" }] : []),
    { h: "A" + d.target_asc + " evaluation after it", f: s => s.eval ? s.eval.won + "/" + s.eval.ok + " won, floor " + fx(s.eval.floor) + ", act 1 " + fp(s.eval.act1, 0) + ", act 2 " + fp(s.eval.act2, 0) : s.eval_text ? s.eval_text : "–", wrap: 1 },
    { h: "not on the laptop", f: s => s.missing && s.missing.length ? s.missing.join(", ") : "", wrap: 1 }], segs.map(s => ({ ...s, _dim: !s.counted })))));
}

/* ---------- problems ---------- */
function renderProblems() {

    { h: "kind", f: p => h("span", { class: "tag" }, h("span", { class: "dot " + (kinds[p.kind] || kinds.note)[0] }), (kinds[p.kind] || kinds.note)[1]) }, { h: "log line", f: p => h("span", { class: "mono" }, p.text + (p.detail && p.detail.length ? " | " + p.detail.join(" | ") : "")), wrap: 1 }], sp)));
  const ap = d.problems.actors.filter(p => segShown(p.seg));
  const c2 = card(host, "Actors that went silent or exited", "An actor whose last progress line is more than 10 minutes before the other actors’ last line, and “no progress for 300 s” exits", true); c2.style.marginTop = "12px";
  if (!ap.length) c2.append(h("div", { class: "empty" }, d.have.meta_segments.length ? "None in the actor logs of the shown segments." : "No actor logs on the laptop. Run a light sync."));
  else c2.append(h("div", { class: "scroll" }, tbl([{ h: "segment", f: p => p.seg, n: 1 }, { h: "actor", f: p => p.actor }, { h: "last line (UTC · local)", f: p => p.ts ? tUTC(p.ts) + " · " + tLoc(p.ts) : "–" }, { h: "what", f: p => p.text, wrap: 1 }], ap)));

  er.sort((a, b) => a.seg - b.seg || b.n - a.n);
  const c3 = card(host, "Runs that ended with an error", "Grouped by error text (numbers replaced by #); error runs are not trained on", true); c3.style.marginTop = "12px";
  const withRuns = segList().filter(s => s.runs);
  if (!withRuns.length) c3.append(h("div", { class: "empty" }, "No run records on the laptop. Run a light sync."));
  else if (!er.length) c3.append(h("div", { class: "empty" }, "No error runs among the " + fi(withRuns.reduce((a, s) => a + s.runs.lines, 0)) + " run records of segment " + withRuns.map(s => s.seg).join(", ") + "."));
  else c3.append(h("div", { class: "scroll" }, tbl([{ h: "segment", f: e => e.seg, n: 1 }, { h: "runs", f: e => fi(e.n), n: 1 }, { h: "of", f: e => fi(e.of), n: 1 }, { h: "error", f: e => h("span", { class: "mono" }, e.text), wrap: 1 }, { h: "actors", f: e => e.actors, wrap: 1 }, { h: "example (seed, floor)", f: e => (e.seed || "–") + ", floor " + (e.floor == null ? "–" : e.floor) }], er)));
  // combat stalemates by encounter: self-play run records per segment, evaluations
  const stSegs = segList().filter(s => s.runs && s.runs.stale && Object.keys(s.runs.stale).length);
  const stEv = (d.eval || []).filter(e => segShown(e.seg) && ((e.records && e.records.stale && Object.keys(e.records.stale).length) || (e.report && e.report.stale && Object.keys(e.report.stale).length)));
  if (stSegs.length || stEv.length) {
    const cs = card(host, "Combat stalemates by encounter", "Runs that ended with “combat stalemate: ENCOUNTER.X” (InvalidOperationException), per segment of self-play (run records) and per evaluation (run records or the hook’s report)", true); cs.style.marginTop = "12px";
    const cols = [...stSegs.map(s => ({ k: "s" + s.seg, m: s.runs.stale, n: s.runs.lines })), ...stEv.map(e => ({ k: "eval " + e.seg, m: (e.records && e.records.stale) || e.report.stale, n: e.records ? e.records.n + e.records.errors : e.e ? e.e.n : null }))];
    const encs = [...new Set(cols.flatMap(c => Object.keys(c.m)))].sort((a, b) => cols.reduce((x, c) => x + (c.m[b] || 0), 0) - cols.reduce((x, c) => x + (c.m[a] || 0), 0));

    ce.append(h("div", { class: "scroll" }, tbl([{ h: "time (UTC · local)", f: p => p.ts ? dUTC(p.ts).slice(5) + " " + tUTC(p.ts) + " · " + tLoc(p.ts) : "–", nw: 1 }, { h: "segment", f: p => p.seg == null ? "–" : p.seg, n: 1 },
      { h: "kind", f: p => ({ hook: "chain hook", prune: "pruning", switch: "network switch", downtime: "downtime", eval_rerun: "evaluation run again", carry: "carry backup", restore: "restore" })[p.kind] || p.kind }, { h: "log line", f: p => h("span", { class: "mono" }, p.text.replace(/research\/s3\/runs\//g, "")), wrap: 1 }], ev.slice().reverse())));

  }
  $("foot").textContent = "Local data: " + d.base + " · parsed in " + d.build_seconds + " s at " + tLoc(d.generated_at, true) + " · segments with meta on the laptop: " + (d.have.meta_segments.join(", ") || "none") +
    " · with fight records: " + (d.have.fights_segments.join(", ") || "none") + ". This page loads nothing from the internet.";
}

/* ---------- render + poll ---------- */
function renderAll() {
  if (!S.data) return;
  const y = scrollY;
  for (const f of [renderTop, renderRun, renderFilters, renderEval, renderCurriculum, renderAsc, renderPotions, renderSelfplay, renderDeaths, renderTrainer, renderThroughput, renderProblems]) sec(f);
  scrollTo(0, y);
}
async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify(body || {}) });
    const j = await r.json(); if (j.sync) { S.sync = j.sync; S.parse = j.parse; } if (j.run) S.runinfo = j.run;
    renderTop(); if (!j.ok && j.message) flash(j.message);
  } catch (e) { flash("The panel process does not answer: " + e.message); }
}
let flashT = null;
function flash(msg) { const l = $("syncline"); l.prepend(h("span", { class: "err" }, msg)); clearTimeout(flashT); flashT = setTimeout(renderTop, 6000); }
let lastAgeBucket = null, down = false;
async function poll() {
  try {
    const first = !S.data;
    const j = await (await fetch(first ? "/api/data" : "/api/state", { cache: "no-store" })).json();
    down = false; S.sync = j.sync; S.parse = j.parse; S.runinfo = j.run || S.runinfo;
    if (j.data && j.data.generated_at) { S.data = j.data; S.builtAt = j.parse.built_at; renderAll(); }
    else if (S.data && j.parse.built_at && j.parse.built_at !== S.builtAt) {
      const k = await (await fetch("/api/data", { cache: "no-store" })).json();
      if (k.data && k.data.generated_at) { S.data = k.data; S.builtAt = k.parse.built_at; S.sync = k.sync; S.parse = k.parse; renderAll(); }
    }
    renderTop();
    const a = statusAge(), b = a == null ? 0 : Math.floor(a / 60);      // banners and "time left" follow the clock
    if (S.data && b !== lastAgeBucket) { lastAgeBucket = b; const y = scrollY; sec(renderRun); scrollTo(0, y); }
  } catch (e) {
    if (!down) { down = true; $("asof").replaceChildren(h("span", { class: "pill crit" }, h("span", { class: "dot crit" }), "The panel process does not answer (was it stopped?). The page shows what it last received.")); }
  }
}
$("b-light").onclick = () => post("/api/sync", { level: "light" });
$("b-full").onclick = () => post("/api/sync", { level: "full" });
$("b-prev").onclick = () => post("/api/preview");
$("auto").onchange = e => post("/api/auto", { minutes: +e.target.value, level: "light" });
$("runsel").onchange = e => { post("/api/run", { run: e.target.value }); e.target.blur(); };
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
{ let t = new URLSearchParams(location.search).get("theme"); if (t == null) { try { t = localStorage.getItem("s3panel-theme") || ""; } catch (e) { t = ""; } }
  applyTheme(t); $("theme").value = t; $("theme").onchange = e => { applyTheme(e.target.value); try { localStorage.setItem("s3panel-theme", e.target.value); } catch (x) {} }; }
let rz = null; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderAll, 200); });
poll(); setInterval(poll, 3000);
